name: Changesets
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
  changesets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MADHATCHER_PAT }}
      - run: |
          git config user.name "madhatcher"
          git config user.email "144481279+madhatcher@users.noreply.github.com"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: changesets/action@d0ee272882939fa35f22d979828acb7e61e0bd47 # v2.0.0-next.4
        with:
          github-token: ${{ secrets.MADHATCHER_PAT }}
          push-with-git-cli: true
          version-script: bash -c "bun run changeset version && bun run format"
          publish-script: bun run changeset publish
          commit-message: version packages
          pr-title: version packages
          pr-draft: create
